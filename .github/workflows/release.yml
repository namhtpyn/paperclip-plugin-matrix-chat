name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm OIDC trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for OIDC trusted publishing
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Build happens inside semantic-release's prepare step (after the
      # version bump) via @semantic-release/exec, so the internal manifest
      # version always matches the published package version.

      # npm OIDC trusted publishing: @semantic-release/npm 13.x exchanges this
      # job's OIDC identity for a short-lived publish token — no NPM_TOKEN needed
      # once the package exists on npm and its Trusted Publisher is configured:
      #   npmjs.com -> paperclip-plugin-matrix-chat -> Settings -> Trusted Publisher
      #     GitHub Actions / namhtpyn / paperclip-plugin-matrix-chat / release.yml / (env blank)
      # NPM_TOKEN (classic Automation token) is only needed to bootstrap the
      # package name; delete the secret after configuring the Trusted Publisher.
      - name: Preflight npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! curl -sfo /dev/null https://registry.npmjs.org/paperclip-plugin-matrix-chat; then
            if [ -z "$NPM_TOKEN" ]; then
              echo "::error::paperclip-plugin-matrix-chat does not exist on npm yet, and OIDC trusted publishing cannot create a new package. Either (a) bootstrap once from a logged-in npm session (npm publish --access public), then configure the Trusted Publisher on npmjs.com, or (b) temporarily set the NPM_TOKEN secret (classic Automation token) so this workflow can create it — then configure the Trusted Publisher and delete the secret."
              exit 1
            fi
            echo "package not on npm yet; NPM_TOKEN present -> bootstrap publish via token"
          else
            echo "package exists on npm; OIDC trusted publishing will be used (no token required)"
          fi

      - name: Get OIDC token URL
        id: idtokenurl
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: echo "url=${ACTIONS_ID_TOKEN_REQUEST_URL}" >> "$GITHUB_OUTPUT"

      - name: Debug OIDC identity (claims npm will match against)
        run: |
          set -x
          RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${{ steps.idtokenurl.outputs.url }}&audience=npmjs.com")
          echo "RAW RESPONSE: $RESP" | head -c 600
          IDT=$(echo "$RESP" | jq -r .value)
          echo "IDT length: ${#IDT}"
          if [ -n "$IDT" ] && [ "$IDT" != "null" ]; then
            P1=$(echo "$IDT" | cut -d. -f2)
            P1="$P1$(printf '%*s' $(( (4 - ${#P1} % 4) % 4 )) '' | tr ' _-' '/ ~+')"
            echo "$P1" | base64 -d 2>/dev/null | jq '{sub, job_workflow_ref, repository_owner, repository, workflow, ref, environment, actor, iss}' || echo "$P1" | base64 -d 2>/dev/null | head -c 800
          fi
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release (semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
